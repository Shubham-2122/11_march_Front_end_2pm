<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let choice = "%^&"
        let a = 30
        let b = 20

        switch (choice) {
            case "+":
                console.log("Sum :", a + b)
                break;
            case "-":
                console.log("Sub :", a - b)
                break

            case "*":
                console.log("Mul :", a * b)
                break
            case "/":
                console.log("divi :", a / b)
                break
            default:
                console.log("Invalid Choice..")
                break;
        }

    </script>
</body>

</html>
