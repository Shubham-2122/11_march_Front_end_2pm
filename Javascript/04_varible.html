<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- varible : it's collection of multiple value store in single varible -->

    <!-- Rules 
        1) do not start with number (56shubham)
        2) do not start with symbols (%@sadhjk) 
        3) do nost start with keyword (32) , console,for,if
    
        syntax : 
        var-type vari-name = value
    -->


    <script>
        // 1) var : global 
        var a = 10 // delcare allow
        var a = 13 // re-delcare allow
        a = 16 // re-assigement allow
        console.log("A :",a)

        // 2) let : local 
        let b = 20 // delcare allow
        // let b = 25  // re-delcare not allow
        b = 30 // re-assigement allow
        console.log("B :",b)


        // 3) const : unique 
        const c = 60  // delcare allow
        // const c = 70  // re-delcare not allow
        // c = 90 // // re-assigement allow
        console.log("C :",c)
    </script>
</body>
</html>
