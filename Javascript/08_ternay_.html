<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- ternay , compari -->

    <script>

        let a = 20
        let b = 10

        let data = (a > b) ? true : false
        console.log(data)

        console.log((a > b) ? true : false)
        console.log((a < b) ? true : false)

        console.log((a > b) ? "hello" : "karish")
        console.log((a < b) ? "hello" : "karish")

        console.log((a > b) ? a : b)
        console.log((a < b) ? a : b)



        let x = 10
        let y = "10"

        // value ==
        console.log((x==y)?true:false)

        // value and datatype
         console.log((x===y)?true:false)

    </script>
</body>

</html>
