<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        1) primitive : only one value 
        2) non-primitive : multiple value 


        primitive 
        1) string
        2) number
        3) boolean
        4) undefined 
        5) null
        6) bigInt
        7) symbole
    -->

    <script>

    // 1) number :+ ,- ,.decimal
        let a = 10.67 
        console.log(a)
        console.log(typeof(a))

        // 2) string 
        let name1 = "shubham jadav"
        console.log(name1)
        console.log(typeof(name1))

        // 3) true and false 
        let data = false 
        console.log(data)
        console.log(typeof(data))


        // 4) undefiend
        let ab
        console.log(ab)
        console.log(typeof(ab))

        // 5) null : object 
        let newd = null 
        console.log(newd)
        console.log(typeof(newd))


        // 6) bigInt 
        let data1 = BigInt(345646345674576)
        console.log(data1)
        console.log(typeof(data1))

        // 7) symbols 
        let sym =Symbol(34)
        console.log(sym)
        console.log(typeof(sym))

    </script>

</body>
</html>
