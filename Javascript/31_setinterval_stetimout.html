<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- set interval : eveny call function start  : counter-->
    <!-- set timeout : eveny timout end function end  : silder-->

    <script>

        setInterval(demo,1000)

        function demo(){
            console.log("hello interval")
            document.writeln("hello inteval<br>")
        }


        setTimeout(function(){
            console.log("Hello timeout")
        },1000)

    </script>

</body>
</html>
