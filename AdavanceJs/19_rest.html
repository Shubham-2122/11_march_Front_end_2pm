<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- store value
    ...rest : always store a value in function as parmater
    ...spread -->

    <script>


        function test(...runs){
            let sum = 0
            for(let demo in runs){
                sum = sum + runs[demo]
            }
            return sum
        }

        console.log(test(10,20,30,40,20))

    </script>
</body>
</html>
