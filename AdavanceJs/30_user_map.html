<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <table border="5" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>Email</th>
                <th>city</th>
                <th>company</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    
    <script>
        fetch("https://jsonplaceholder.typicode.com/users",{
            method:"GET"
        })
        .then((res)=>{
            return res.json()
        })
        .then((res)=>{
            console.log(res)

            let htmlElement = res.map((user,index)=>{
                console.log(user)
                return(
                    `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                             <td>${user.email}</td>
                              <td>${user.address.city}</td>
                               <td>${user.company.name}</td>
                        </tr>
                    `
                )
            })
            document.querySelector("#data").innerHTML += htmlElement.join("")
        })
    </script>

</body>
</html>
