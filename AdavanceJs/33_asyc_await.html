<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function demo(){
            setTimeout(()=>{
                console.log("Api function")
            },2000)
        }

        async function test(){
            console.log("Hello 1")
            await demo()
            console.log("Hello 2")
            console.log("Hello 2")
            await demo()
            console.log("Hello 2")
        }
        test()
    </script>
</body>
</html>
