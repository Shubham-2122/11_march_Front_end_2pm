<body>
    

    <script>

        // 1) var : global varibale 
        var x = 10 // declaration allow
        var x = 12 // re-delacration  allow
        x = 15 // re-assigement allow

        console.log("x :",x)

        // 2) let : local varibale
        let y = 20 // declaration allow
        // let y = 22 // re-declaration not allow 
        y = 25 // re-assigement allow
        console.log("y :",y)


        // 3) Const 
        const z = 40 // declaration allow
        // const z = 45 //// re-declaration not allow 
        // z = 48 //re-assigement not allow
        console.log("Z :",z)

    </script>

</body>
