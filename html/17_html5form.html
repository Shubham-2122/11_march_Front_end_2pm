<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- html 5 new input type -->

    <table align="center">
        <form action="" align="center">
            <tr>
                <td><label for="">Enter your name</label></td>
                <td><input type="text" placeholder="enter your name" title="name"></td>
            </tr>
            <tr>
                <td><label for="">Enter your surname</label></td>
                <td> <input type="text" placeholder="enter your surname" title="surname"></td>
            </tr>

            <tr>
                <td><label for="">Enter your email</label></td>
                <td><input type="email" placeholder="enter your email" title="email"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your number</label></td>
                <td> <input type="tel" placeholder="enter your number" title="number"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your password</label></td>
                <td> <input type="password" placeholder="enter your password" title="password"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your color</label></td>
                <td> <input type="color"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your date</label></td>
                <td> <input type="date"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your datetime</label></td>
                <td> <input type="datetime-local"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your time</label></td>
                <td> <input type="time"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your week</label></td>
                <td> <input type="week"></td>
            </tr>
            <tr>
                <td> <label for="">Enter your month</label></td>
                <td><input type="month"></td>
            </tr>
            <tr>
                <td><label for="">Enter your gender</label></td>
                <td>
                    <input name="gm" type="radio">Male
                    <input name="gm" type="radio">Female
                    <input name="gm" type="radio">other
                </td>
            </tr>
            <tr>
                <td><label for="">Enter your skills</label></td>
                <td>
                    <input type="checkbox"> C
                    <input type="checkbox"> C++
                    <input type="checkbox"> database
                    <input type="checkbox"> Html <br>
                    <input type="checkbox"> Css
                    <input type="checkbox"> Javascript
                    <input type="checkbox"> react
                </td>
            </tr>
            <tr>
                <td><label for="">Select file</label></td>
                <td><input multiple type="file"></td>
            </tr>
            <tr>
                <td>Your imges</td>
                <td><input type="image" src="/imges/first.jpg" width="100px"></td>
            </tr>
            <tr>
                <td>Enter your address</td>
                <td>
                    <textarea name="" id="" cols="30" rows="10"></textarea>
                </td>
            </tr>
            <tr>
                <td align="center" colspan="2">
                    <input type="submit" value="Login" name="" id="">
                    <input type="reset">
                    <button type="submit">Register</button>
                </td>
            </tr>
        </form>
    </table>




</body>

</html>
