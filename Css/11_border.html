<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            height: 200px;
            width: 200px;
            border: 2px solid;
        }
    </style>
</head>

<body>
    <h1 style="border: 2px solid red;">Border data</h1>
    <h1 style="border-width: 5px;border-style: solid;border-color: green;">Border data</h1>
    <h1 style="border: 2px dashed red;">Border data</h1>
    <h1 style="border: 10px dotted red;">Border data</h1>
    <h1 style="border: 10px double red;">Border data</h1>
    <h1 style="border: 10px ridge grey;">Border data</h1>
    <h1 style="border: 10px inset grey;">Border data</h1>
    <h1 style="border: 10px outset grey;">Border data</h1>
    <h1 style="border-top: 10px solid grey;">Border data</h1>
    <h1 style="border-bottom: 10px solid grey;">Border data</h1>
    <h1 style="border-right: 10px solid grey;">Border data</h1>
    <h1 style="border-left: 10px solid grey;">Border data</h1>
    <div class="main">

    </div>
</body>

</html>
