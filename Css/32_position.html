<head>
    <meta charset="UTF-8">

        .main{
            background-color: orange;
            border: 4px solid gray;
            height: 800px;
            display: flex;

        .box{
            height: 100px;

           #box5{
            position: relative;
           }
           .box1{
            height: 30px;
            width: 30px;
            background-color: aqua;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
           }
           .box2{
            height: 25px;
            width: 25px;
            background-color: rgb(23, 216, 23);
            position: absolute;
            top: 0%;
           }
    </style>
</head>
<body>
    <!-- 
    position 5 types 

    1) static : by default : top,bottom,left,right , pc,rem,em,%
    2) fixed : body tag :  top,bottom,left,right , pc,rem,em,% allow
    3) sticky : section tag :  top,bottom,left,right , pc,rem,em,% 
    4) raletive : perent tag :  top,bottom,left,right , pc,rem,em,% 
    5) abusulate : child tag :  top,bottom,left,right , pc,rem,em,%
    -->

    <section class="main">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
        <div class="box" id="box5">
            <div class="box1">5</div>
            <div class="box2">5</div>
        </div>
        <div class="box">6</div>
    </section>
    <section class="main"></section>
     <section class="main"></section>


</body>
